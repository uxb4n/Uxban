  <script src="/listen/listen-config.js"></script>

  <style>
    .releases-page-header {
      padding: 160px var(--pad-x) 48px;
      border-bottom: 1px solid var(--border);
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .releases-page-header small {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      display: block;
      margin-bottom: 14px;
    }
    .releases-page-title {
      font-family: var(--sans);
      font-size: clamp(3rem, 11vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.88;
      text-transform: uppercase;
    }
    .releases-page-sub {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 22px;
      line-height: 1.7;
      max-width: 540px;
    }

    .releases-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 32px var(--pad-x);
      max-width: var(--max-w);
      margin: 0 auto;
      gap: 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .filter-pills {
      position: relative;
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 4px;
      overflow: hidden;
    }
    .filter-pill-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      background: #fff;
      border-radius: 999px;
      z-index: 0;
      transition: transform 0.45s var(--spring), width 0.45s var(--spring), height 0.45s var(--spring);
      will-change: transform, width, height;
    }
    .filter-pill-bg.no-anim { transition: none; }
    .filter-pill {
      position: relative;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 22px;
      cursor: pointer;
      z-index: 1;
      border-radius: 32px;
      transition: color 0.25s var(--ease);
      white-space: nowrap;
    }
    .filter-pill:hover { color: #fff; }
    .filter-pill.active { color: #000; }

    .sort-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sort-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-right: 8px;
    }
    .sort-pill {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .sort-pill:hover { border-color: var(--border-2); color: #fff; }
    .sort-pill.active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent-dim);
    }

    .release-grid-wrap {
      padding: 48px var(--pad-x) 100px;
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .release-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .release-tile {
      position: relative;
      background: var(--bg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s var(--ease);
      will-change: transform;
    }
    .release-tile:hover { background: var(--bg-elev); }

    .release-tile-img {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0a0a0a;
    }
    .release-tile-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s var(--ease), filter 0.5s var(--ease);
    }
    .release-tile:hover .release-tile-img img {
      transform: scale(1.06);
      filter: brightness(0.45);
    }

    .release-tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 2;
      pointer-events: none;
    }
    .release-tile:hover .release-tile-overlay { pointer-events: auto; }

    .platform-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: translateY(14px) scale(0.85);
      opacity: 0;
      transition:
        transform 0.35s var(--spring),
        opacity 0.28s var(--ease),
        background 0.2s,
        border-color 0.2s;
    }
    .release-tile:hover .platform-icon {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    .release-tile:hover .platform-icon:nth-child(1) { transition-delay: 0ms; }
    .release-tile:hover .platform-icon:nth-child(2) { transition-delay: 70ms; }
    .release-tile:hover .platform-icon:nth-child(3) { transition-delay: 140ms; }

    .platform-icon:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(0) scale(1.12) !important;
    }
    .platform-icon svg { width: 18px; height: 18px; fill: currentColor; }

    .release-tile-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      padding: 5px 11px;
      text-transform: uppercase;
      z-index: 3;
      background: var(--accent);
      color: #fff;
    }
    .release-tile-badge.single {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .release-tile-info {
      padding: 18px 20px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-top: 1px solid var(--border);
    }
    .release-tile-name {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.005em;
      line-height: 1.25;
      text-transform: uppercase;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: letter-spacing 0.3s var(--ease);
    }
    .release-tile:hover .release-tile-name { letter-spacing: 0.02em; }
    .release-tile-meta {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .release-tile-year {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      flex-shrink: 0;
      padding-top: 2px;
    }

    @keyframes tileIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .release-tile {
      animation: tileIn 0.5s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 30ms);
    }
    .release-tile.hidden {
      display: none;
      animation: none;
    }

    .releases-empty {
      display: none;
      padding: 100px 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .releases-empty.visible { display: block; }

    .release-count {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .release-count strong { color: #fff; font-weight: 500; }

    .release-skeleton {
      aspect-ratio: 1 / 1;
      background: var(--bg-card);
      position: relative;
      overflow: hidden;
    }
    .release-skeleton::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      animation: shimmer 1.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @media (max-width: 1100px) { .release-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      .releases-page-header { padding: 140px var(--pad-x) 32px; }
      .releases-controls { padding: 24px var(--pad-x); }
      .release-grid-wrap { padding: 32px var(--pad-x) 80px; }
      .release-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-pill { padding: 9px 16px; font-size: 11px; }
      .sort-label { display: none; }
    }
    @media (max-width: 480px) {
      .release-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
/* ══════════════════════════════════════════════
   RELEASES PAGE
══════════════════════════════════════════════ */

const ICONS = {
  spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
  apple:   '<svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
};

const slugMap = {};
const _cfg = window.UXBAN_LINKS_CONFIG || {};
if (Array.isArray(_cfg)) {
  _cfg.forEach(c => { if (c.spotifyId) slugMap[c.spotifyId] = c.slug; });
} else if (_cfg.custom) {
  // new object-shaped config — no spotifyId map needed
}

function slugify(name) {
  return String(name || '').toLowerCase()
    .replace(/['']/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

function platformUrls(release) {
  const q = encodeURIComponent(release.name);
  return {
    spotify: release.links?.spotify      || `https://open.spotify.com/search/${q}`,
    apple:   release.links?.appleMusic   || `https://music.apple.com/search?term=${q}`,
    youtube: release.links?.youtubeMusic || `https://music.youtube.com/search?q=${q}`,
  };
}

let allReleases = [];
let state = { filter: 'all', sort: 'newest' };

function applyFilterSort() {
  let list = [...allReleases];
  if (state.filter !== 'all') {
    list = list.filter(r => r.type.toLowerCase() === state.filter);
  }
  switch (state.sort) {
    case 'newest': list.sort((a, b) => new Date(b.release.release_date) - new Date(a.release.release_date)); break;
    case 'oldest': list.sort((a, b) => new Date(a.release.release_date) - new Date(b.release.release_date)); break;
    case 'az':     list.sort((a, b) => a.release.name.localeCompare(b.release.name)); break;
  }
  return list;
}

function buildTile(item, index) {
  const { release, cover, type } = item;
  const urls = platformUrls(release);
  const year = release.release_date?.slice(0, 4) || '';

  const slug    = slugify(release.name);
  const tileUrl = `/listen/${slug}/`;

  const tile = document.createElement('div');
  tile.className = 'release-tile spotlight-card';
  tile.dataset.id   = release.id;
  tile.dataset.type = type;
  tile.dataset.date = release.release_date || '';
  tile.dataset.name = release.name.toLowerCase();
  tile.dataset.url  = tileUrl;
  tile.style.setProperty('--i', index);

  tile.innerHTML = `
    <div class="release-tile-img">
      <img src="${cover}" alt="${release.name}" loading="lazy">
      <span class="release-tile-badge ${type.toLowerCase()}">${type}</span>
      <div class="release-tile-overlay">
        <a class="platform-icon" href="${urls.spotify}" target="_blank" rel="noopener" aria-label="Spotify" data-platform="spotify">${ICONS.spotify}</a>
        <a class="platform-icon" href="${urls.apple}"   target="_blank" rel="noopener" aria-label="Apple Music" data-platform="apple">${ICONS.apple}</a>
        <a class="platform-icon" href="${urls.youtube}" target="_blank" rel="noopener" aria-label="YouTube Music" data-platform="youtube">${ICONS.youtube}</a>
      </div>
    </div>
    <div class="release-tile-info">
      <div style="min-width:0;flex:1;">
        <h3 class="release-tile-name">${release.name}</h3>
        <p class="release-tile-meta">${type}</p>
      </div>
      <span class="release-tile-year">${year}</span>
    </div>`;

  tile.querySelectorAll('.platform-icon').forEach(icon => {
    icon.addEventListener('click', e => e.stopPropagation());
  });

  tile.addEventListener('click', () => { window.location.href = tile.dataset.url; });

  return tile;
}

function flipAnimate(grid, mutate) {
  const tiles = [...grid.querySelectorAll('.release-tile')];
  const before = new Map();
  tiles.forEach(el => {
    if (!el.classList.contains('hidden')) before.set(el.dataset.id, el.getBoundingClientRect());
  });
  mutate();
  tiles.forEach(el => {
    if (el.classList.contains('hidden')) return;
    const first = before.get(el.dataset.id);
    if (!first) return;
    const last = el.getBoundingClientRect();
    const dx = first.left - last.left;
    const dy = first.top  - last.top;
    if (dx || dy) {
      el.animate(
        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
        { duration: 520, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
      );
    }
  });
}

function renderGrid() {
  const grid  = document.getElementById('release-grid');
  const empty = document.getElementById('releases-empty');
  const count = document.getElementById('release-count');

  const list    = applyFilterSort();
  const visible = new Set(list.map(r => r.release.id));
  const total   = allReleases.length;

  count.innerHTML = `// <strong>${list.length}</strong> OF ${total} RELEASE${total !== 1 ? 'S' : ''}`;

  if (!total) {
    grid.innerHTML = '';
    empty.classList.add('visible');
    return;
  }

  flipAnimate(grid, () => {
    grid.querySelectorAll('.release-tile').forEach(el => {
      el.classList.toggle('hidden', !visible.has(el.dataset.id));
    });
    const byId = new Map();
    grid.querySelectorAll('.release-tile').forEach(el => byId.set(el.dataset.id, el));
    list.forEach(item => {
      const el = byId.get(item.release.id);
      if (el) grid.appendChild(el);
    });
  });

  empty.classList.toggle('visible', list.length === 0);
}

function updateFilterPillBg(instant) {
  const pills  = document.getElementById('filter-pills');
  const active = pills.querySelector('.filter-pill.active');
  const bg     = document.getElementById('filter-pill-bg');
  if (!active || !bg) return;

  const pillsRect  = pills.getBoundingClientRect();
  const activeRect = active.getBoundingClientRect();
  const cs = getComputedStyle(pills);
  const borderL = parseFloat(cs.borderLeftWidth) || 0;
  const borderT = parseFloat(cs.borderTopWidth)  || 0;

  const x = (activeRect.left - pillsRect.left) - borderL;
  const y = (activeRect.top  - pillsRect.top)  - borderT;

  if (instant) {
    bg.classList.add('no-anim');
    void bg.offsetWidth;
  }

  bg.style.width     = activeRect.width  + 'px';
  bg.style.height    = activeRect.height + 'px';
  bg.style.transform = `translate(${x}px, ${y}px)`;

  if (instant) {
    requestAnimationFrame(() => bg.classList.remove('no-anim'));
  }
}

async function loadReleases() {
  try {
    const res  = await fetch('/api/spotify');
    const data = await res.json();

    allReleases = [
      ...(data.albums  || []).map(r => ({ release: r, cover: r.images?.[0]?.url || '', type: 'ALBUM'  })),
      ...(data.singles || []).map(r => ({ release: r, cover: r.images?.[0]?.url || '', type: 'SINGLE' })),
    ];

    const grid = document.getElementById('release-grid');
    grid.innerHTML = '';

    if (!allReleases.length) {
      document.getElementById('release-count').textContent = '// NO RELEASES';
      document.getElementById('releases-empty').classList.add('visible');
      return;
    }

    allReleases.forEach((item, i) => grid.appendChild(buildTile(item, i)));

    renderGrid();

    requestAnimationFrame(() => updateFilterPillBg(true));
  } catch (err) {
    console.warn('Releases load failed:', err.message);
    document.getElementById('release-count').textContent = '// FAILED TO LOAD';
  }
}

document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) return;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    updateFilterPillBg();
    renderGrid();
  });
});

document.querySelectorAll('.sort-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) return;
    document.querySelectorAll('.sort-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.sort = btn.dataset.sort;
    renderGrid();
  });
});

window.addEventListener('resize', () => updateFilterPillBg(true), { passive: true });

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => updateFilterPillBg(true));
}

const scrollTop = document.getElementById('scroll-top');
if (scrollTop) {
  window.addEventListener('scroll', () => scrollTop.classList.toggle('visible', window.scrollY > 400), { passive: true });
  scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

const hamburger = document.getElementById('hamburger');
const mobileNav = document.getElementById('mobile-nav');
if (hamburger && mobileNav) {
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileNav.classList.toggle('open');
  });
}

const topBar = document.getElementById('top-bar');
if (topBar) {
  window.addEventListener('scroll', () => topBar.classList.toggle('scrolled', window.scrollY > 60), { passive: true });
}

function updateNavOffset() {
  const banner = document.getElementById('site-banner');
  const nav    = document.getElementById('top-bar');
  if (!nav) return;
  const visible = banner && banner.style.display !== 'none';
  nav.style.top = visible ? banner.offsetHeight + 'px' : '0';
}
updateNavOffset();
window.addEventListener('resize', updateNavOffset);

const bannerClose = document.querySelector('.site-banner-close');
if (bannerClose) {
  bannerClose.addEventListener('click', () => {
    document.getElementById('site-banner').style.display = 'none';
    setTimeout(updateNavOffset, 30);
  });
}

loadReleases();
</script>

<script src="/assets/command-palette.js" defer></script>
</body>
</html>
