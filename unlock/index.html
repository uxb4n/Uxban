<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Uxban | Unlock</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/_vercel/insights/script.js"></script>

  <script src="/unlock/unlock-config.js"></script>
  <script src="/assets/banner.js" defer></script>

  <style>
    /* =========================
       UNLOCK PAGE
    ========================= */
    .unlock-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 140px var(--pad-x) 100px;
      position: relative;
    }

    .unlock-wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    /* ── Cover ── */
    .unlock-cover-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .unlock-cover-glow {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(0.7);
      opacity: 0.4;
      z-index: 0;
      border-radius: 8px;
      pointer-events: none;
      transition: opacity 0.6s var(--ease);
    }

    .unlock-cover {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      transition: filter 0.6s var(--ease), transform 0.6s var(--ease);
    }

    /* Locked → blur the cover */
    .unlock-page.is-locked .unlock-cover {
      filter: blur(12px) brightness(0.55) saturate(0.7);
      transform: scale(1.02);
    }

    /* ── Lock badge overlay on the cover ── */
    .unlock-badge {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .unlock-page.is-locked .unlock-badge { display: flex; }

    .unlock-badge-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      animation: unlockPulse 2.6s ease-in-out infinite;
    }
    .unlock-badge-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    @keyframes unlockPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(26, 58, 255, 0.25); }
      50%      { box-shadow: 0 0 0 16px rgba(26, 58, 255, 0); }
    }

    /* ── Info panel ── */
    .unlock-info { max-width: 460px; }

    .unlock-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }

    .unlock-title {
      font-family: var(--sans);
      font-size: clamp(2.6rem, 5.5vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.92;
      text-transform: uppercase;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .unlock-desc {
      font-size: 16px;
      color: var(--fg-dim);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 400px;
    }

    /* ── CTA button ── */
    .unlock-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #000;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 20px 38px;
      border: none;
      cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
      position: relative;
    }
    .unlock-cta:hover { background: var(--accent); color: #fff; }
    .unlock-cta:active { transform: scale(0.98); }
    .unlock-cta:disabled { opacity: 0.5; cursor: not-allowed; }

    .unlock-cta svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    /* ── Waiting state (after click, before return) ── */
    .unlock-waiting {
      display: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 20px;
      align-items: center;
      gap: 12px;
    }
    .unlock-waiting.visible { display: inline-flex; }

    .unlock-waiting::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: waitingPulse 1.4s ease-in-out infinite;
    }
    @keyframes waitingPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Manual fallback button ── */
    .unlock-manual {
      display: none;
      margin-top: 24px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      padding: 0;
      border-bottom: 1px solid var(--border-2);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .unlock-manual:hover { color: #fff; border-color: #fff; }
    .unlock-manual.visible { display: inline-block; }

    /* ── Countdown (for "too early" state) ── */
    .unlock-countdown {
      display: flex;
      gap: 0;
      margin: 32px 0 24px;
    }
    .unlock-cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 64px;
      padding-right: 20px;
      margin-right: 20px;
      border-right: 1px solid var(--border);
    }
    .unlock-cd-unit:last-child {
      border-right: none;
      padding-right: 0;
      margin-right: 0;
    }
    .unlock-cd-num {
      font-family: var(--sans);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .unlock-cd-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Audio player (unlocked state) ── */
    .unlock-rewards {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .reward-audio {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      gap: 20px;
      transition: border-color 0.3s var(--ease);
    }
    .reward-audio:hover { border-color: var(--border-2); }

    .reward-cover {
      width: 72px;
      height: 72px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .reward-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reward-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reward-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reward-time {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .reward-progress-wrap {
      height: 3px;
      background: var(--border-2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .reward-progress {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    .reward-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .reward-play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      transition: background 0.2s, color 0.2s, transform 0.15s var(--spring);
    }
    .reward-play:hover { background: var(--accent); color: #fff; transform: scale(1.05); }
    .reward-play:active { transform: scale(0.95); }

    .reward-play svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      margin-left: 2px;
    }
    .reward-play .icon-pause { display: none; margin-left: 0; }
    .reward-play.playing .icon-play  { display: none; }
    .reward-play.playing .icon-pause { display: block; }

    /* ── Error / status states ── */
    .unlock-status {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 14px 20px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }
    .unlock-status.visible { display: block; }
    .unlock-status.error {
      color: #ff4b4b;
      background: rgba(255, 75, 75, 0.08);
      border: 1px solid rgba(255, 75, 75, 0.25);
    }

    /* ── Entrance animations ── */
    @keyframes unlockFade {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .unlock-fade    { animation: unlockFade 0.6s var(--ease) both; }
    .unlock-fade-1  { animation-delay: 0.05s; }
    .unlock-fade-2  { animation-delay: 0.15s; }
    .unlock-fade-3  { animation-delay: 0.25s; }

    /* ── The "just unlocked" celebration moment ── */
    @keyframes unlockCelebrate {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .unlock-page.just-unlocked .unlock-cover {
      animation: unlockCelebrate 0.8s var(--spring);
    }

    /* ── Loading skeleton ── */
    .unlock-skeleton {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Mobile ── */
    @media (max-width: 900px) {
      .unlock-page { padding: 120px var(--pad-x) 80px; }
      .unlock-wrap {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
      }
      .unlock-cover-wrap { max-width: 380px; margin: 0 auto; }
      .unlock-info { max-width: 100%; margin: 0 auto; }
      .unlock-desc { margin-left: auto; margin-right: auto; }
      .unlock-countdown { justify-content: center; }
      .unlock-cta { padding: 18px 32px; }
    }
  </style>
</head>

<script>
/* ══════════════════════════════════════════════
   UXBAN — UNLOCK PAGE
   URL: /unlock/{slug}/
   Reads config from /unlock/unlock-config.js

   Public flag:
     If cfg.public === false, the page renders as "not found"
     unless ?phase= or ?preview=1 is present. Use this to keep
     an unreleased gate hidden until you're ready to launch.

   Test overrides:
     ?phase=locked|tooEarly|streaming|ended|unlocked
     ?preview=1 → shows normal time-based phase even if private
══════════════════════════════════════════════ */

(function () {
  'use strict';

  const root = document.getElementById('unlock-page');

  /* ── Get slug from URL ── */
  const parts = location.pathname.replace(/\/$/, '').split('/');
  const slug  = decodeURIComponent(parts[parts.length - 1] || '');

  /* ── Look up config ── */
  const config = window.UXBAN_UNLOCK_CONFIG || {};
  const cfg    = config[slug];

  if (!cfg) {
    return renderNotFound();
  }

  /* ── URL params ── */
  const params       = new URLSearchParams(location.search);
  const forcedPhase  = params.get('phase');
  const previewParam = params.get('preview');

  /* ── localStorage keys ── */
  const UNLOCK_KEY  = `uxban-unlock-${slug}`;
  const SESSION_KEY = `uxban-unlock-clicked-${slug}`;

  /* ── State helpers ── */
  function isUnlocked() {
    try { return localStorage.getItem(UNLOCK_KEY) === '1'; } catch { return false; }
  }

  function markUnlocked() {
    try { localStorage.setItem(UNLOCK_KEY, '1'); } catch {}
  }

  function wasClicked() {
    try { return sessionStorage.getItem(SESSION_KEY) === '1'; } catch { return false; }
  }

  function markClicked() {
    try { sessionStorage.setItem(SESSION_KEY, '1'); } catch {}
  }

  function clearClicked() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
  }

  /* ── Time helpers ── */
  function parseTime(iso) {
    if (!iso) return null;
    const t = new Date(iso).getTime();
    return isNaN(t) ? null : t;
  }

  function getPhase() {
    const now      = Date.now();
    const openAt   = parseTime(cfg.openAt);
    const dropAt   = parseTime(cfg.releaseDate);
    const closeAt  = parseTime(cfg.closeAt);

    if (openAt && now < openAt)              return 'tooEarly';
    if (dropAt && now < dropAt)              return 'locked';
    if (closeAt && now > closeAt)            return 'ended';
    if (dropAt && now >= dropAt)             return 'streaming';
    return 'locked';
  }

  /* ══════════════════════════════════════════════
     RENDER — entry point
  ══════════════════════════════════════════════ */
  function render() {
    document.title = `Uxban — ${cfg.title}`;
    root.innerHTML = '';

    /* ── Public gate ──
       If cfg.public is false, block normal visitors.
       Testers can still see it with ?phase= or ?preview=1. */
    if (cfg.public === false && !forcedPhase && previewParam !== '1') {
      return renderNotFound();
    }

    /* ── Forced phase for testing ── */
    if (forcedPhase) {
      switch (forcedPhase) {
        case 'tooEarly':   return renderTooEarly();
        case 'locked':     return renderLocked();
        case 'streaming':  return renderStreaming();
        case 'ended':      return renderEnded();
        case 'unlocked':   return renderUnlocked();
        default:           return renderLocked();
      }
    }

    /* ── If already unlocked, always show reward ── */
    if (isUnlocked()) {
      renderUnlocked();
      return;
    }

    const phase = getPhase();

    switch (phase) {
      case 'tooEarly':   return renderTooEarly();
      case 'locked':     return renderLocked();
      case 'streaming':  return renderStreaming();
      case 'ended':      return renderEnded();
      default:           return renderLocked();
    }
  }

  /* ── Shared cover markup ── */
  function coverHTML() {
    if (!cfg.coverImage) return '';
    return `
      <div class="unlock-cover-wrap unlock-fade unlock-fade-1">
        <div class="unlock-cover-glow" style="background-image:url('${cfg.coverImage}')"></div>
        <div class="unlock-cover" style="background-image:url('${cfg.coverImage}')"></div>
        <div class="unlock-badge">
          <div class="unlock-badge-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          </div>
        </div>
      </div>`;
  }

  /* ── Apply the "locked" class to the page ── */
  function setLockedClass(locked) {
    root.classList.toggle('is-locked', locked);
  }

  /* ── Phase: LOCKED ── */
  function renderLocked() {
    setLockedClass(true);
    root.innerHTML = `
      <div class="unlock-wrap">
        ${coverHTML()}
        <div class="unlock-info">
          <span class="unlock-eyebrow unlock-fade unlock-fade-1">${cfg.locked.eyebrow}</span>
          <h1 class="unlock-title unlock-fade unlock-fade-2">${escapeText(cfg.locked.title)}</h1>
          <p class="unlock-desc unlock-fade unlock-fade-3">${cfg.locked.desc}</p>

          <a class="unlock-cta unlock-fade unlock-fade-3" id="unlock-btn" href="${cfg.streamUrl}" target="_blank" rel="noopener">
            ${cfg.locked.cta}
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>

          <div class="unlock-waiting" id="unlock-waiting">
            ${cfg.locked.waiting || 'Waiting for you to return…'}
          </div>

          <div class="unlock-status" id="unlock-status"></div>

          <button class="unlock-manual" id="unlock-manual">
            I've pre-saved → unlock now
          </button>
        </div>
      </div>`;

    wireUnlockFlow();
  }

  /* ── Phase: STREAMING (post-release, before close) ── */
  function renderStreaming() {
    setLockedClass(true);
    root.innerHTML = `
      <div class="unlock-wrap">
        ${coverHTML()}
        <div class="unlock-info">
          <span class="unlock-eyebrow unlock-fade unlock-fade-1">${cfg.streaming.eyebrow}</span>
          <h1 class="unlock-title unlock-fade unlock-fade-2">${escapeText(cfg.streaming.title)}</h1>
          <p class="unlock-desc unlock-fade unlock-fade-3">${cfg.streaming.desc}</p>

          <a class="unlock-cta unlock-fade unlock-fade-3" id="unlock-btn" href="${cfg.streamUrl}" target="_blank" rel="noopener">
            ${cfg.streaming.cta}
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>

          <div class="unlock-waiting" id="unlock-waiting">
            ${cfg.streaming.waiting || 'Waiting for you to return…'}
          </div>

          <div class="unlock-status" id="unlock-status"></div>

          <button class="unlock-manual" id="unlock-manual">
            I've streamed it → unlock now
          </button>
        </div>
      </div>`;

    wireUnlockFlow();
  }

  /* ── Phase: TOO EARLY ── */
  function renderTooEarly() {
    setLockedClass(true);

    root.innerHTML = `
      <div class="unlock-wrap">
        ${coverHTML()}
        <div class="unlock-info">
          <span class="unlock-eyebrow unlock-fade unlock-fade-1">${cfg.tooEarly.eyebrow}</span>
          <h1 class="unlock-title unlock-fade unlock-fade-2">${escapeText(cfg.tooEarly.title)}</h1>
          <p class="unlock-desc unlock-fade unlock-fade-3">${cfg.tooEarly.desc}</p>

          <div class="unlock-countdown unlock-fade unlock-fade-3" id="unlock-countdown">
            <div class="unlock-cd-unit"><span class="unlock-cd-num" data-cd="days">00</span><span class="unlock-cd-tag">Days</span></div>
            <div class="unlock-cd-unit"><span class="unlock-cd-num" data-cd="hours">00</span><span class="unlock-cd-tag">Hrs</span></div>
            <div class="unlock-cd-unit"><span class="unlock-cd-num" data-cd="mins">00</span><span class="unlock-cd-tag">Mins</span></div>
            <div class="unlock-cd-unit"><span class="unlock-cd-num" data-cd="secs">00</span><span class="unlock-cd-tag">Secs</span></div>
          </div>
        </div>
      </div>`;

    startCountdown(parseTime(cfg.openAt), () => render());
  }

  /* ── Phase: ENDED ── */
  function renderEnded() {
    setLockedClass(true);

    root.innerHTML = `
      <div class="unlock-wrap">
        ${coverHTML()}
        <div class="unlock-info">
          <span class="unlock-eyebrow unlock-fade unlock-fade-1">${cfg.ended.eyebrow}</span>
          <h1 class="unlock-title unlock-fade unlock-fade-2">${escapeText(cfg.ended.title)}</h1>
          <p class="unlock-desc unlock-fade unlock-fade-3">${cfg.ended.desc}</p>

          <a class="unlock-cta unlock-fade unlock-fade-3" href="${cfg.streamUrl}" target="_blank" rel="noopener">
            STREAM NOW
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>`;
  }

  /* ── Phase: UNLOCKED ── */
  function renderUnlocked(justUnlocked) {
    setLockedClass(false);

    const rewardsHTML = (cfg.rewards || []).map(reward => {
      if (reward.type === 'audio') return audioRewardHTML(reward);
      return '';
    }).join('');

    root.innerHTML = `
      <div class="unlock-wrap">
        ${coverHTML()}
        <div class="unlock-info">
          <span class="unlock-eyebrow unlock-fade unlock-fade-1">${cfg.unlocked.eyebrow}</span>
          <h1 class="unlock-title unlock-fade unlock-fade-2">${escapeText(cfg.unlocked.title)}</h1>
          <p class="unlock-desc unlock-fade unlock-fade-3">${cfg.unlocked.desc}</p>

          <div class="unlock-rewards unlock-fade unlock-fade-3">
            ${rewardsHTML}
          </div>
        </div>
      </div>`;

    initAudioPlayers();

    if (justUnlocked) {
      root.classList.add('just-unlocked');
      setTimeout(() => root.classList.remove('just-unlocked'), 1000);
    }
  }

  /* ── Audio reward markup ── */
  function audioRewardHTML(reward) {
    return `
      <div class="reward-audio" data-src="${reward.src}">
        <div class="reward-cover" style="background-image:url('${cfg.coverImage}')"></div>
        <div class="reward-body">
          <div class="reward-meta">
            <span class="reward-label">${reward.label}</span>
            <span class="reward-time" data-time>0:00 / 0:00</span>
          </div>
          <div class="reward-progress-wrap" data-progress-wrap>
            <div class="reward-progress" data-progress></div>
          </div>
          <div class="reward-controls">
            <button class="reward-play" data-play>
              <svg class="icon-play" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
            </button>
          </div>
        </div>
      </div>`;
  }

  /* ══════════════════════════════════════════════
     UNLOCK FLOW — click → open tab → detect return → unlock
  ══════════════════════════════════════════════ */
  function wireUnlockFlow() {
    const btn       = document.getElementById('unlock-btn');
    const waiting   = document.getElementById('unlock-waiting');
    const status    = document.getElementById('unlock-status');
    const manualBtn = document.getElementById('unlock-manual');
    if (!btn) return;

    let manualFallbackTimer = null;

    btn.addEventListener('click', () => {
      markClicked();
      btn.setAttribute('disabled', 'disabled');
      btn.style.opacity = '0.6';
      waiting.classList.add('visible');

      clearTimeout(manualFallbackTimer);
      manualFallbackTimer = setTimeout(() => {
        manualBtn.classList.add('visible');
      }, 20000);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (!wasClicked()) return;
      if (isUnlocked()) return;

      waiting.classList.add('visible');
      setTimeout(() => {
        doUnlock();
      }, 2000);
    });

    manualBtn.addEventListener('click', () => {
      if (!wasClicked()) return;
      doUnlock();
    });

    function doUnlock() {
      clearTimeout(manualFallbackTimer);
      markUnlocked();
      clearClicked();

      if (status) {
        status.textContent = '// UNLOCKED';
        status.classList.add('visible');
      }

      setTimeout(() => {
        renderUnlocked(true);
      }, 400);
    }
  }

  /* ══════════════════════════════════════════════
     COUNTDOWN (used in tooEarly phase)
  ══════════════════════════════════════════════ */
  function startCountdown(target, onComplete) {
    if (!target) return;
    const pad = n => String(n).padStart(2, '0');

    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        if (onComplete) onComplete();
        return;
      }
      const el = k => root.querySelector(`[data-cd="${k}"]`);
      const d  = Math.floor(diff / 86400000);
      const h  = Math.floor((diff % 86400000) / 3600000);
      const m  = Math.floor((diff % 3600000) / 60000);
      const s  = Math.floor((diff % 60000) / 1000);
      if (el('days'))  el('days').textContent  = pad(d);
      if (el('hours')) el('hours').textContent = pad(h);
      if (el('mins'))  el('mins').textContent  = pad(m);
      if (el('secs'))  el('secs').textContent  = pad(s);
    }

    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }

  /* ══════════════════════════════════════════════
     AUDIO PLAYERS (unlocked state)
  ══════════════════════════════════════════════ */
  function initAudioPlayers() {
    const cards = root.querySelectorAll('.reward-audio');
    let currentAudio = null;
    let currentCard  = null;

    cards.forEach(card => {
      const audio      = new Audio(card.dataset.src);
      audio.preload    = 'metadata';
      audio.volume     = 0.8;

      const playBtn     = card.querySelector('[data-play]');
      const progressBar = card.querySelector('[data-progress]');
      const progressWp  = card.querySelector('[data-progress-wrap]');
      const timeEl      = card.querySelector('[data-time]');

      function fmt(s) {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const r = Math.floor(s % 60);
        return `${m}:${String(r).padStart(2, '0')}`;
      }

      function updateTime() {
        if (audio.duration) {
          timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
          progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
      }

      playBtn.addEventListener('click', () => {
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentCard.querySelector('[data-play]').classList.remove('playing');
        }

        if (audio.paused) {
          audio.play();
          playBtn.classList.add('playing');
          currentAudio = audio;
          currentCard  = card;
        } else {
          audio.pause();
          playBtn.classList.remove('playing');
        }
      });

      audio.addEventListener('timeupdate', updateTime);
      audio.addEventListener('loadedmetadata', updateTime);
      audio.addEventListener('ended', () => {
        playBtn.classList.remove('playing');
        progressBar.style.width = '0%';
        updateTime();
      });

      progressWp.addEventListener('click', e => {
        if (!audio.duration) return;
        const rect = progressWp.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      });
    });
  }

  /* ══════════════════════════════════════════════
     HELPERS
  ══════════════════════════════════════════════ */
  function escapeText(str) {
    return String(str || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderNotFound() {
    root.innerHTML = `
      <div class="unlock-wrap">
        <div style="grid-column:1/-1; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; padding:120px 0;">
          <p style="margin-bottom:20px;">// NOTHING TO UNLOCK HERE</p>
          <a href="/releases/" style="color:var(--accent); text-decoration:none;">← BACK TO RELEASES</a>
        </div>
      </div>`;
  }

  /* ══════════════════════════════════════════════
     BOOT
  ══════════════════════════════════════════════ */
  render();

})();

/* ── Nav / banner / scroll-top (site-wide patterns) ── */
const scrollTop = document.getElementById('scroll-top');
if (scrollTop) {
  window.addEventListener('scroll', () => scrollTop.classList.toggle('visible', window.scrollY > 400), { passive: true });
  scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

const hamburger = document.getElementById('hamburger');
const mobileNav = document.getElementById('mobile-nav');
if (hamburger && mobileNav) {
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileNav.classList.toggle('open');
  });
}

const topBar = document.getElementById('top-bar');
if (topBar) {
  window.addEventListener('scroll', () => topBar.classList.toggle('scrolled', window.scrollY > 60), { passive: true });
}

function updateNavOffset() {
  const banner = document.getElementById('site-banner');
  const nav    = document.getElementById('top-bar');
  if (!nav) return;
  const visible = banner && banner.style.display !== 'none' && !banner.classList.contains('dismissed');
  nav.style.top = visible ? banner.offsetHeight + 'px' : '0';
}
updateNavOffset();
window.addEventListener('resize', updateNavOffset);

document.addEventListener('uxban:banner-rendered', () => setTimeout(updateNavOffset, 10));
</script>
