<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uxban | Vault</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    .secret-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 30px; text-align: center;
      padding: 120px 40px 80px;
    }
    .secret-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 4px;
      color: var(--accent); text-transform: uppercase;
    }
    .secret-title {
      font-size: clamp(3rem, 10vw, 8rem); font-weight: 900;
      letter-spacing: -0.05em; line-height: 0.9;
    }
    .secret-input-wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .secret-input {
      background: transparent; border: 1px solid #222; color: #fff;
      padding: 14px 24px; font-size: 14px; letter-spacing: 4px; text-align: center;
      outline: none; width: 260px; text-transform: uppercase;
      font-family: var(--mono); transition: border-color 0.3s;
    }
    .secret-input:focus { border-color: var(--neon); }
    .secret-input.wrong { border-color: red; animation: shake 0.3s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .secret-submit {
      background: transparent; border: 1px solid #333; color: #fff;
      padding: 12px 30px; font-size: 10px; letter-spacing: 3px;
      cursor: pointer; font-family: var(--mono); transition: 0.3s;
    }
    .secret-submit:hover { border-color: #fff; }
    .secret-error {
      font-size: 10px; letter-spacing: 2px; color: red;
      opacity: 0; transition: opacity 0.3s;
      font-family: var(--mono);
    }
    .secret-error.show { opacity: 1; }

    .secret-content {
      display: none; flex-direction: column; gap: 10px;
      max-width: 700px; width: 100%; text-align: left;
    }
    .secret-content.visible { display: flex; }
    .secret-track { padding: 24px 0; border-bottom: 1px solid #111; }
    .track-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .track-header h3 { font-size: 14px; letter-spacing: 2px; font-family: var(--mono); }
    .track-header p  { font-size: 10px; color: var(--accent); letter-spacing: 2px; font-family: var(--mono); }

    .player { display: flex; align-items: center; gap: 16px; }
    .play-btn {
      background: transparent; border: 1px solid #333; color: #fff;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; flex-shrink: 0; transition: 0.3s;
    }
    .play-btn:hover, .play-btn.playing { border-color: var(--neon); color: var(--neon); }
    .progress-wrap {
      flex: 1; height: 2px; background: #222; position: relative; cursor: pointer;
    }
    .progress-bar {
      height: 100%; background: var(--neon); width: 0%;
      transition: width 0.1s linear; pointer-events: none;
    }
    .time {
      font-size: 9px; letter-spacing: 1px; color: var(--accent);
      min-width: 70px; text-align: right; flex-shrink: 0; font-family: var(--mono);
    }
    .gate { display: flex; flex-direction: column; gap: 20px; align-items: center; }
  </style>
</head>

<body>
<div class="noise"></div>

<nav class="mobile-nav" id="mobile-nav">
  <a href="/">HOME</a>
  <a href="/releases/">RELEASES</a>
  <a href="/store/">STORE</a>
  <div class="mobile-nav-footer"><span>© 2026 UXBAN</span></div>
</nav>

<nav class="top-bar" id="top-bar">
  <div class="logo-wrap"><a href="/"><img src="/assets/images/logo.png" class="nav-logo" alt="uxban"></a></div>
  <div class="nav-links">
    <a href="/">HOME</a>
    <a href="/releases/">RELEASES</a>
    <a href="/store/">STORE</a>
  </div>
  <div class="nav-info">
    <span class="dot"></span>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="page-wrap">
  <main class="secret-wrap">
    <div class="gate" id="gate">
      <p class="secret-label">// RESTRICTED ACCESS</p>
      <h1 class="secret-title">ENTER<br>CODE</h1>
      <div class="secret-input-wrap">
        <input class="secret-input" id="secret-input" type="password" placeholder="••••••••" maxlength="20">
        <p class="secret-error" id="secret-error">// WRONG CODE</p>
        <button class="secret-submit" id="secret-submit">UNLOCK</button>
      </div>
    </div>

    <div class="secret-content" id="secret-content">
      <p class="secret-label">// UNRELEASED</p>
      <h2 style="font-size: clamp(2rem, 6vw, 5rem); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 20px;">VAULT</h2>

      <div class="secret-track">
        <div class="track-header">
          <div><h3>FACED IT</h3><p>UNRELEASED // 2026</p></div>
        </div>
        <div class="player" data-src="/assets/audio/secret1.mp3">
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
          <div class="progress-wrap" onclick="seek(this, event)"><div class="progress-bar"></div></div>
          <span class="time">0:00 / 0:00</span>
        </div>
      </div>

      <div class="secret-track">
        <div class="track-header">
          <div><h3>FAKE DOPE 2010 (FEAT. ZEEBO)</h3><p>UNRELEASED // 2026</p></div>
        </div>
        <div class="player" data-src="/assets/audio/secret2.mp3">
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
          <div class="progress-wrap" onclick="seek(this, event)"><div class="progress-bar"></div></div>
          <span class="time">0:00 / 0:00</span>
        </div>
      </div>
    </div>
  </main>
</div>

<button class="scroll-top" id="scroll-top" aria-label="Back to top">↑</button>

<script>
  (async function checkSession() {
    try {
      const res = await fetch('/api/secret-check', { credentials: 'same-origin' });
      if (res.ok) unlockVault();
    } catch {}
  })();

  document.getElementById('secret-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });

  document.getElementById('secret-submit').onclick = tryUnlock;

  let _unlocking = false;
  async function tryUnlock() {
    if (_unlocking) return;
    _unlocking = true;

    const input = document.getElementById('secret-input');
    const error = document.getElementById('secret-error');
    const btn   = document.getElementById('secret-submit');

    btn.disabled = true;
    error.classList.remove('show');

    try {
      const res = await fetch('/api/secret-login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body:        JSON.stringify({ password: input.value }),
      });

      if (res.ok) {
        input.value = '';
        unlockVault();
      } else if (res.status === 429) {
        error.textContent = '// TOO MANY ATTEMPTS — WAIT A FEW MINUTES';
        error.classList.add('show');
        input.value = '';
      } else {
        input.classList.add('wrong');
        error.textContent = '// WRONG CODE';
        error.classList.add('show');
        setTimeout(() => { input.classList.remove('wrong'); input.value = ''; }, 500);
      }
    } catch {
      error.textContent = '// NETWORK ERROR — TRY AGAIN';
      error.classList.add('show');
    } finally {
      btn.disabled = false;
      _unlocking   = false;
    }
  }

  function unlockVault() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('secret-content').classList.add('visible');
    initPlayers();
  }

  const audioMap = new WeakMap();

  function initPlayers() {
    document.querySelectorAll('.player').forEach(player => {
      const audio = new Audio(player.dataset.src);
      audioMap.set(player, audio);
      audio.addEventListener('timeupdate',      () => updateProgress(player, audio));
      audio.addEventListener('loadedmetadata',  () => updateProgress(player, audio));
      audio.addEventListener('ended', () => {
        const btn = player.querySelector('.play-btn');
        btn.textContent = '▶';
        btn.classList.remove('playing');
      });
    });
  }

  function togglePlay(btn) {
    const player = btn.closest('.player');
    const audio  = audioMap.get(player);
    if (!audio) return;

    document.querySelectorAll('.player').forEach(p => {
      if (p !== player) {
        const a = audioMap.get(p);
        if (a && !a.paused) {
          a.pause();
          p.querySelector('.play-btn').textContent = '▶';
          p.querySelector('.play-btn').classList.remove('playing');
        }
      }
    });

    if (audio.paused) {
      audio.play();
      btn.textContent = '■';
      btn.classList.add('playing');
    } else {
      audio.pause();
      btn.textContent = '▶';
      btn.classList.remove('playing');
    }
  }

  function seek(progressWrap, e) {
    const player = progressWrap.closest('.player');
    const audio  = audioMap.get(player);
    if (!audio || !audio.duration) return;
    const rect = progressWrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }

  function updateProgress(player, audio) {
    const bar  = player.querySelector('.progress-bar');
    const time = player.querySelector('.time');
    if (audio.duration) {
      bar.style.width  = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
    }
  }

  function formatTime(s) {
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }
</script>

<script src="/script.js"></script>
</body>
</html>
