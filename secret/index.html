<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/banner.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uxban | Vault</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    .secret-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 30px; text-align: center;
      padding: 160px 40px 80px;
    }
    .secret-label {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.25em;
      color: var(--accent); text-transform: uppercase;
    }
    .secret-title {
      font-family: var(--sans);
      font-size: clamp(3rem, 10vw, 8rem); font-weight: 900;
      letter-spacing: -0.04em; line-height: 0.9; text-transform: uppercase;
    }
    .secret-input-wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .secret-input {
      background: transparent; border: 1px solid var(--border-2); color: #fff;
      padding: 14px 24px; font-size: 14px; letter-spacing: 0.25em; text-align: center;
      outline: none; width: 260px; text-transform: uppercase;
      font-family: var(--mono); transition: border-color 0.3s;
    }
    .secret-input:focus { border-color: var(--accent); }
    .secret-input.wrong { border-color: #ff4b4b; animation: shake 0.3s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .secret-submit {
      background: #fff; border: none; color: #000;
      padding: 14px 32px; font-family: var(--sans);
      font-size: 12px; letter-spacing: 0.18em; font-weight: 700;
      cursor: pointer; text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .secret-submit:hover { background: var(--accent); color: #fff; }
    .secret-submit:disabled { opacity: 0.5; cursor: wait; }
    .secret-error {
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.15em; color: #ff4b4b;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase;
    }
    .secret-error.show { opacity: 1; }

    .secret-content {
      display: none; flex-direction: column; gap: 10px;
      max-width: 700px; width: 100%; text-align: left;
    }
    .secret-content.visible { display: flex; }
    .secret-track { padding: 24px 0; border-bottom: 1px solid var(--border); }
    .track-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .track-header h3 {
      font-family: var(--sans); font-size: 15px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .track-header p  {
      font-family: var(--mono); font-size: 10px;
      color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase;
    }

    .player { display: flex; align-items: center; gap: 16px; }
    .play-btn {
      background: transparent; border: 1px solid var(--border-2); color: #fff;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px; flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .play-btn:hover, .play-btn.playing {
      border-color: var(--accent); color: #fff; background: var(--accent-dim);
    }
    .progress-wrap {
      flex: 1; height: 2px; background: var(--border); position: relative; cursor: pointer;
    }
    .progress-bar {
      height: 100%; background: var(--accent); width: 0%;
      transition: width 0.1s linear; pointer-events: none;
    }
    .time {
      font-family: var(--mono); font-size: 10px;
      letter-spacing: 0.1em; color: var(--muted);
      min-width: 70px; text-align: right; flex-shrink: 0;
    }
    .gate { display: flex; flex-direction: column; gap: 20px; align-items: center; }
  </style>
</head>

<body>
<div class="noise"></div>

<nav class="mobile-nav" id="mobile-nav">
  <a href="/">HOME</a>
  <a href="/releases/">RELEASES</a>
  <a href="/events/">EVENTS</a>
  <a href="/about/">ABOUT</a>
  <a href="/store/">STORE</a>
  <div class="mobile-nav-footer">© 2026 UXBAN</div>
</nav>

<nav class="top-bar" id="top-bar">
  <a href="/"><img src="/assets/images/logo.png" class="nav-logo" alt="uxban"></a>
  <div class="nav-links">
    <a href="/">HOME</a>
    <a href="/releases/">RELEASES</a>
    <a href="/events/">EVENTS</a>
    <a href="/about/">ABOUT</a>
    <a href="/store/">STORE</a>
  </div>
  <div class="nav-info">
    <button class="nav-search" onclick="window.UxbanCmdk && window.UxbanCmdk.open()" aria-label="Search (⌘K)" title="Search (⌘K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
    </button>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="page-wrap">
  <main class="secret-wrap">
    <div class="gate" id="gate">
      <p class="secret-label">// RESTRICTED ACCESS</p>
      <h1 class="secret-title">ENTER<br>CODE</h1>
      <div class="secret-input-wrap">
        <input class="secret-input" id="secret-input" type="password" placeholder="••••••••" maxlength="20">
        <p class="secret-error" id="secret-error">// WRONG CODE</p>
        <button class="secret-submit" id="secret-submit">UNLOCK</button>
      </div>
    </div>

    <div class="secret-content" id="secret-content">
      <p class="secret-label">// UNRELEASED</p>
      <h2 style="font-family:var(--sans);font-size:clamp(2rem,6vw,5rem);font-weight:900;letter-spacing:-0.04em;margin-bottom:20px;text-transform:uppercase;">VAULT</h2>

      <div class="secret-track">
        <div class="track-header">
          <div><h3>FACED IT</h3><p>UNRELEASED // 2026</p></div>
        </div>
        <div class="player" data-src="/assets/audio/secret1.mp3">
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
          <div class="progress-wrap" onclick="seek(this, event)"><div class="progress-bar"></div></div>
          <span class="time">0:00 / 0:00</span>
        </div>
      </div>

<button class="scroll-top" id="scroll-top" aria-label="Back to top">↑</button>

<script>
  (async function checkSession() {
    try {
      const res = await fetch('/api/auth?action=secret-check', { credentials: 'same-origin' });
      if (res.ok) unlockVault();
    } catch {}
  })();

  document.getElementById('secret-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryUnlock();
  });

  document.getElementById('secret-submit').onclick = tryUnlock;

  let _unlocking = false;
  async function tryUnlock() {
    if (_unlocking) return;
    _unlocking = true;

    const input = document.getElementById('secret-input');
    const error = document.getElementById('secret-error');
    const btn   = document.getElementById('secret-submit');

    btn.disabled = true;
    error.classList.remove('show');

    try {
      const res = await fetch('/api/auth?action=secret-login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body:        JSON.stringify({ password: input.value }),
      });

      if (res.ok) {
        input.value = '';
        unlockVault();
      } else if (res.status === 429) {
        error.textContent = '// TOO MANY ATTEMPTS — WAIT A FEW MINUTES';
        error.classList.add('show');
        input.value = '';
      } else {
        input.classList.add('wrong');
        error.textContent = '// WRONG CODE';
        error.classList.add('show');
        setTimeout(() => { input.classList.remove('wrong'); input.value = ''; }, 500);
      }
    } catch {
      error.textContent = '// NETWORK ERROR — TRY AGAIN';
      error.classList.add('show');
    } finally {
      btn.disabled = false;
      _unlocking   = false;
    }
  }

  function unlockVault() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('secret-content').classList.add('visible');
    initPlayers();
  }

  const audioMap = new WeakMap();

  function initPlayers() {
    document.querySelectorAll('.player').forEach(player => {
      const audio = new Audio(player.dataset.src);
      audioMap.set(player, audio);
      audio.addEventListener('timeupdate',      () => updateProgress(player, audio));
      audio.addEventListener('loadedmetadata',  () => updateProgress(player, audio));
      audio.addEventListener('ended', () => {
        const btn = player.querySelector('.play-btn');
        btn.textContent = '▶';
        btn.classList.remove('playing');
      });
    });
  }

  function togglePlay(btn) {
    const player = btn.closest('.player');
    const audio  = audioMap.get(player);
    if (!audio) return;

    document.querySelectorAll('.player').forEach(p => {
      if (p !== player) {
        const a = audioMap.get(p);
        if (a && !a.paused) {
          a.pause();
          p.querySelector('.play-btn').textContent = '▶';
          p.querySelector('.play-btn').classList.remove('playing');
        }
      }
    });

    if (audio.paused) {
      audio.play();
      btn.textContent = '■';
      btn.classList.add('playing');
    } else {
      audio.pause();
      btn.textContent = '▶';
      btn.classList.remove('playing');
    }
  }

  function seek(progressWrap, e) {
    const player = progressWrap.closest('.player');
    const audio  = audioMap.get(player);
    if (!audio || !audio.duration) return;
    const rect = progressWrap.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }

  function updateProgress(player, audio) {
    const bar  = player.querySelector('.progress-bar');
    const time = player.querySelector('.time');
    if (audio.duration) {
      bar.style.width  = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
    }
  }

  function formatTime(s) {
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  /* ── Nav offset (banner-aware) ── */
  function updateNavOffset() {
    const banner = document.getElementById('site-banner');
    const nav    = document.getElementById('top-bar');
    if (!nav) return;
    const visible = banner && banner.style.display !== 'none';
    nav.style.top = visible ? banner.offsetHeight + 'px' : '0';
  }
  updateNavOffset();
  window.addEventListener('resize', updateNavOffset);

  /* ── Scroll to top ── */
  const scrollTop = document.getElementById('scroll-top');
  if (scrollTop) {
    window.addEventListener('scroll', () => scrollTop.classList.toggle('visible', window.scrollY > 400), { passive: true });
    scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  /* ── Hamburger ── */
  const hamburger = document.getElementById('hamburger');
  const mobileNav = document.getElementById('mobile-nav');
  if (hamburger && mobileNav) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileNav.classList.toggle('open');
    });
  }

  /* ── Nav scroll shrink ── */
  const topBar = document.getElementById('top-bar');
  if (topBar) {
    window.addEventListener('scroll', () => topBar.classList.toggle('scrolled', window.scrollY > 60), { passive: true });
  }
</script>

<script src="/assets/command-palette.js" defer></script>
<script src="/script.js"></script>
</body>
</html>
