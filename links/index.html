</div>

<script>
  document.querySelectorAll('a[href]').forEach(link => {
    const href = link.getAttribute('href');
    if (href.startsWith('/') && !href.startsWith('//') && !link.hasAttribute('target')) {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = href; }, 200);
      });
    }
  });

  const ICONS = {
    spotify:      '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
    appleMusic:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026C4.786.07 4.043.15 3.34.428 2.004.958 1.04 1.88.475 3.208c-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.801.42.127.856.187 1.293.228.555.053 1.11.06 1.667.06h11.03c.525 0 1.048-.034 1.572-.093.484-.05.964-.13 1.422-.295 1.426-.514 2.377-1.494 2.93-2.909.147-.37.22-.753.275-1.14.063-.447.092-.898.092-1.35V6.12z"/></svg>',
    youtubeMusic: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
  };
  const LABELS = { spotify: 'SPOTIFY', appleMusic: 'APPLE MUSIC', youtubeMusic: 'YOUTUBE MUSIC' };

  function buildStreamButtons(links) {
    return Object.entries(links)
      .filter(([, url]) => !!url)
      .map(([platform, url]) => `
        <a class="links-btn" href="${url}" target="_blank">
          <span class="links-btn-icon">${ICONS[platform] || ''}</span>
          ${LABELS[platform] || platform.toUpperCase()}
          <span class="links-btn-arrow">↗</span>
        </a>
      `).join('');
  }

  function newest(releases) {
    return [...(releases || [])].sort(
      (a, b) => new Date(b.release_date) - new Date(a.release_date)
    )[0];
  }

  async function renderLinksPage() {
    try {
      const res  = await fetch('/api/spotify');
      const data = await res.json();

      const allReleases = [
        ...(data.albums  || []).map(r => ({ ...r, _type: 'ALBUM'  })),
        ...(data.singles || []).map(r => ({ ...r, _type: 'SINGLE' })),
      ];
      if (!allReleases.length) return;

      const latest = newest(allReleases);
      const cover  = latest.images?.[0]?.url || '';
      const title  = latest.name.toUpperCase();
      const url    = latest.links?.spotify || '#';
      const label  = latest._type === 'SINGLE' ? '// LATEST SINGLE' : '// LATEST ALBUM';
      const year   = new Date(latest.release_date).getFullYear();

      const featured = document.getElementById('links-featured');
      featured.href = url;
      featured.style.display = '';
      document.getElementById('links-featured-img').style.backgroundImage = `url('${cover}')`;
      document.getElementById('links-featured-title').textContent = title;
      document.getElementById('links-featured-label').textContent = label;
      document.getElementById('links-featured-sub').textContent   = year;

      document.getElementById('links-stream-label').textContent  = `// STREAM ${title}`;
      document.getElementById('links-stream-buttons').innerHTML  = buildStreamButtons(latest.links || {});
      document.getElementById('links-stream-section').style.display = '';

      const latestAlbum = newest(data.albums);
      if (latestAlbum && latestAlbum.id !== latest.id) {
        document.getElementById('links-album-buttons').innerHTML = `
          <a class="links-btn" href="${latestAlbum.links?.spotify || '#'}" target="_blank">
            <span class="links-btn-icon">${ICONS.spotify}</span>
            ${latestAlbum.name.toUpperCase()} — STREAM NOW
            <span class="links-btn-arrow">↗</span>
          </a>`;
        document.getElementById('links-album-section').style.display = '';
      }
    } catch (err) {
      console.error('Failed to render links page:', err);
    }
  }

  renderLinksPage();
</script>

</body>
</html>
