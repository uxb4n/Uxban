<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Uxban — Listen</title>

  <meta name="description"           id="meta-desc"    content="Stream or pre-save on all platforms.">
  <meta property="og:type"                             content="music.song">
  <meta property="og:url"            id="og-url"       content="">
  <meta property="og:title"          id="og-title"     content="Uxban — Listen">
  <meta property="og:description"    id="og-desc"      content="Stream or pre-save on all platforms.">
  <meta property="og:image"          id="og-image"     content="">
  <meta name="twitter:card"                            content="summary_large_image">
  <meta name="twitter:site"                            content="@uxbanwtf">
  <meta name="twitter:title"         id="tw-title"     content="Uxban — Listen">
  <meta name="twitter:description"   id="tw-desc"      content="Stream or pre-save on all platforms.">
  <meta name="twitter:image"         id="tw-image"     content="">

  <!-- Load the shared config BEFORE this page's script -->
  <script src="/listen/listen-config.js"></script>

  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/_vercel/insights/script.js"></script>

  
</head>

<body>
<div class="noise"></div>

<!-- Minimal nav -->
<nav class="lp-nav">
  <a href="/"><img src="/logo.png" class="lp-nav-logo" alt="uxban"></a>
  <div class="lp-nav-right">
    <a href="/releases/" class="lp-nav-link">RELEASES</a>
    <a href="/store/"    class="lp-nav-link">STORE</a>
  </div>
</nav>

<div class="lp-wrap">
  <div class="lp-bg"      id="lp-bg"></div>
  <div class="lp-bg-fade"></div>

  <div class="lp-inner" id="lp-inner">
    <!-- Populated by JS -->
    <div class="lp-skeleton" style="width:200px;height:200px;border-radius:10px;margin-bottom:28px;"></div>
    <div class="lp-skeleton" style="width:120px;height:12px;border-radius:4px;margin-bottom:14px;"></div>
    <div class="lp-skeleton" style="width:240px;height:48px;border-radius:4px;margin-bottom:24px;"></div>
    <div class="lp-skeleton" style="width:100%;height:56px;border-radius:12px;margin-bottom:10px;"></div>
    <div class="lp-skeleton" style="width:100%;height:56px;border-radius:12px;"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   UXBAN LISTEN PAGE — /listen/[slug]/
   Reads config from window.UXBAN_LINKS_CONFIG
   Fetches cover + metadata from /api/spotify
   ══════════════════════════════════════════════ */

(async function () {

  /* ── 1. Resolve slug from URL ────────────────
     URL is /listen/switch-up/ → slug = 'switch-up'
  ─────────────────────────────────────────────*/
  const pathParts = location.pathname.replace(/\/$/, '').split('/');
  const slug      = pathParts[pathParts.length - 1];

  /* ── 2. Find config entry ─────────────────── */
  const cfg = (window.UXBAN_LINKS_CONFIG || []).find(c => c.slug === slug);

  if (!cfg) {
    renderError('Release not found.');
    return;
  }

  /* ── 3. Determine released state ─────────── */
  const now       = Date.now();
  const dropTime  = new Date(cfg.releaseDate).getTime();
  const released  = cfg.released || now >= dropTime;

  /* ── 4. Fetch Spotify data (for cover + name) */
  let spotifyRelease = null;

  if (cfg.spotifyId) {
    try {
      const res  = await fetch('/api/spotify');
      const data = await res.json();
      const all  = [...(data.albums || []), ...(data.singles || [])];
      spotifyRelease = all.find(r =>
        r.id === cfg.spotifyId ||
        r.external_urls?.spotify?.includes(cfg.spotifyId)
      ) || null;
    } catch (e) {
      console.warn('Spotify fetch failed:', e.message);
    }
  }

  /* ── 5. Merge data ────────────────────────── */
  const title    = spotifyRelease?.name    || cfg.title    || slug.replace(/-/g,' ').toUpperCase();
  const subtitle = cfg.subtitle            || '';
  const type     = cfg.type               || 'SINGLE';
  const cover    = spotifyRelease?.images?.[0]?.url || cfg.coverImage || '';
  const year     = spotifyRelease?.release_date?.slice(0,4)
                   || new Date(cfg.releaseDate).getFullYear();

  /* Merge links: config wins over nothing, Spotify ID used in URL */
  const links = {
    spotify:      cfg.links?.spotify      || (spotifyRelease?.external_urls?.spotify) || '',
    appleMusic:   cfg.links?.appleMusic   || '',
    youtubeMusic: cfg.links?.youtubeMusic || '',
    presave:      cfg.links?.presave      || '',
  };

  /* ── 6. Update meta tags ─────────────────── */
  const pageUrl = `https://uxban.com/listen/${slug}/`;
  document.getElementById('page-title').textContent   = `Uxban — ${title}`;
  document.getElementById('og-title').content         = `Uxban — ${title}`;
  document.getElementById('tw-title').content         = `Uxban — ${title}`;
  document.getElementById('og-url').content           = pageUrl;
  const descText = released
    ? `Stream ${title} by Uxban on Spotify, Apple Music and more.`
    : `Pre-save ${title} by Uxban — dropping ${new Date(cfg.releaseDate).toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'})}.`;
  document.getElementById('meta-desc').content        = descText;
  document.getElementById('og-desc').content          = descText;
  document.getElementById('tw-desc').content          = descText;
  if (cover) {
    document.getElementById('og-image').content       = cover;
    document.getElementById('tw-image').content       = cover;
  }

  /* ── 7. Render ───────────────────────────── */
  const inner = document.getElementById('lp-inner');
  const bg    = document.getElementById('lp-bg');

  if (cover) bg.style.backgroundImage = `url('${cover}')`;

  inner.innerHTML = `
    ${cover ? `<div class="lp-cover" id="lp-cover" style="background-image:url('${cover}')"></div>` : ''}
    <span class="lp-badge ${type.toLowerCase()}">${type}</span>
    <p class="lp-artist">UXBAN</p>
    <h1 class="lp-title">${title}</h1>
    ${subtitle ? `<p class="lp-subtitle">${subtitle}</p>` : ''}
    ${released ? renderReleased(links, year) : renderPresave(links, cfg.releaseDate)}
    <div class="lp-copy-row">
      <input class="lp-copy-input" id="lp-copy-input" readonly value="${pageUrl}">
      <button class="lp-copy-btn" id="lp-copy-btn">COPY LINK</button>
    </div>
    <div class="lp-footer">
      <a class="lp-back"         href="/">← UXBAN.COM</a>
      <a class="lp-all-releases" href="/releases/">ALL RELEASES</a>
    </div>
  `;

  /* Copy link button */
  document.getElementById('lp-copy-btn').addEventListener('click', function () {
    navigator.clipboard.writeText(pageUrl).then(() => {
      this.textContent = 'COPIED ✓';
      this.classList.add('copied');
      setTimeout(() => {
        this.textContent = 'COPY LINK';
        this.classList.remove('copied');
      }, 1800);
    });
  });

  /* Start countdown if presave */
  if (!released) startCountdown(cfg.releaseDate);

})();

/* ──────────────────────────────────────────────
   RENDER HELPERS
─────────────────────────────────────────────── */

function renderReleased(links, year) {
  const btns = [];

  if (links.spotify) {
    btns.push(`
      <a class="lp-btn primary" href="${links.spotify}" target="_blank" rel="noopener">
        <span class="lp-btn-icon">${iconSpotify()}</span>
        SPOTIFY
      </a>`);
  }

  if (links.appleMusic) {
    btns.push(`
      <a class="lp-btn" href="${links.appleMusic}" target="_blank" rel="noopener">
        <span class="lp-btn-icon">${iconApple()}</span>
        APPLE MUSIC
      </a>`);
  }

  if (links.youtubeMusic) {
    btns.push(`
      <a class="lp-btn" href="${links.youtubeMusic}" target="_blank" rel="noopener">
        <span class="lp-btn-icon">${iconYouTube()}</span>
        YOUTUBE MUSIC
      </a>`);
  }

  if (!btns.length) {
    btns.push(`<p style="font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--accent);padding:20px 0">LINKS COMING SOON</p>`);
  }

  return `
    <p class="lp-date">
      <span class="lp-date-dot"></span>
      OUT ${year}
      <span class="lp-date-dot"></span>
    </p>
    <div class="lp-buttons">${btns.join('')}</div>
  `;
}

function renderPresave(links, releaseDate) {
  const d = new Date(releaseDate);
  const dateStr = d.toLocaleDateString('en-NZ', {
    day: 'numeric', month: 'long', year: 'numeric'
  }).toUpperCase();

  const presaveBtn = links.presave
    ? `<a class="lp-btn presave" href="${links.presave}" target="_blank" rel="noopener">
         <span class="lp-btn-icon" style="position:absolute;left:22px">${iconSpotify()}</span>
         PRE-SAVE ON SPOTIFY
       </a>`
    : '';

  return `
    <p class="lp-date">
      <span class="lp-date-dot"></span>
      DROPPING ${dateStr}
      <span class="lp-date-dot"></span>
    </p>
    <div class="lp-countdown" id="lp-countdown">
      <div class="lp-cd-unit"><span class="lp-cd-num" id="lp-cd-d">00</span><span class="lp-cd-tag">DAYS</span></div>
      <div class="lp-cd-unit"><span class="lp-cd-num" id="lp-cd-h">00</span><span class="lp-cd-tag">HOURS</span></div>
      <div class="lp-cd-unit"><span class="lp-cd-num" id="lp-cd-m">00</span><span class="lp-cd-tag">MINS</span></div>
      <div class="lp-cd-unit"><span class="lp-cd-num" id="lp-cd-s">00</span><span class="lp-cd-tag">SECS</span></div>
    </div>
    <div class="lp-buttons" style="position:relative">${presaveBtn}</div>
  `;
}

/* ──────────────────────────────────────────────
   COUNTDOWN
─────────────────────────────────────────────── */

function startCountdown(isoDate) {
  const target = new Date(isoDate).getTime();
  const pad    = n => String(n).padStart(2,'0');

  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      /* Reload page so it flips to released state */
      location.reload();
      return;
    }
    const dEl = document.getElementById('lp-cd-d');
    const hEl = document.getElementById('lp-cd-h');
    const mEl = document.getElementById('lp-cd-m');
    const sEl = document.getElementById('lp-cd-s');
    if (!dEl) return;

    const newS = pad(Math.floor((diff % 60000) / 1000));
    if (sEl && sEl.textContent !== newS) {
      sEl.textContent = newS;
      sEl.classList.add('tick');
      setTimeout(() => sEl.classList.remove('tick'), 200);
    }

    if (dEl) dEl.textContent = pad(Math.floor(diff / 86400000));
    if (hEl) hEl.textContent = pad(Math.floor((diff % 86400000) / 3600000));
    if (mEl) mEl.textContent = pad(Math.floor((diff % 3600000) / 60000));
  }

  tick();
  setInterval(tick, 1000);
}

/* ──────────────────────────────────────────────
   ERROR STATE
─────────────────────────────────────────────── */

function renderError(msg) {
  document.getElementById('lp-inner').innerHTML = `
    <div class="lp-error">
      <p style="margin-bottom:16px">// ${msg}</p>
      <a class="lp-back" href="/">← BACK TO UXBAN.COM</a>
    </div>
  `;
}

/* ──────────────────────────────────────────────
   PLATFORM ICONS (inline SVG)
─────────────────────────────────────────────── */

  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`;
}

  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026C4.786.07 4.043.15 3.34.428 2.004.958 1.04 1.88.475 3.208c-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.801.42.127.856.187 1.293.228.555.053 1.11.06 1.667.06h11.03a12.5 12.5 0 001.57-.1c.822-.106 1.596-.35 2.295-.81 1.154-.758 1.92-1.797 2.22-3.15.142-.666.19-1.34.2-2.018.003-.15.006-.302.006-.453V6.337c-.003-.07-.006-.14-.01-.213zM12 17.5c-3.038 0-5.5-2.462-5.5-5.5S8.962 6.5 12 6.5s5.5 2.462 5.5 5.5-2.462 5.5-5.5 5.5zm5.75-9.978a1.286 1.286 0 110-2.572 1.286 1.286 0 010 2.572zM12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/></svg>`;

  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>`;
}
</script>
</body>
</html>
