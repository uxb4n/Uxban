<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Uxban | Release</title>

  <meta name="description"         id="meta-desc" content="">
  <meta property="og:type"                        content="music.album">
  <meta property="og:url"          id="og-url"    content="">
  <meta property="og:title"        id="og-title"  content="">
  <meta property="og:description"  id="og-desc"   content="">
  <meta property="og:image"        id="og-image"  content="">
  <meta name="twitter:card"                       content="summary_large_image">
  <meta name="twitter:site"                       content="@uxbanwtf">
  <meta name="twitter:title"       id="tw-title"  content="">
  <meta name="twitter:description" id="tw-desc"   content="">
  <meta name="twitter:image"       id="tw-image"  content="">

  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/_vercel/insights/script.js"></script>

  <script src="/listen/listen-config.js"></script>
  <script src="/release/release-config.js"></script>
  <script src="/assets/preview-player.js?v=3" defer></script>
  <script src="/assets/banner.js" defer></script>

  <style>
    .rel-page {
      padding: 140px var(--pad-x) 0;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .rel-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
      padding: 60px 0 100px;
      border-bottom: 1px solid var(--border);
    }

    .rel-cover-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .rel-cover-glow {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(0.8);
      opacity: 0.35;
      z-index: 0;
      border-radius: 8px;
      pointer-events: none;
    }

    .rel-cover {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55);
      will-change: transform;
      transform-origin: center center;
      transition: box-shadow 0.4s var(--ease);
    }

    .rel-info { max-width: 560px; }

    .rel-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 4px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .rel-badge.album  { background: var(--accent); color: #fff; }
    .rel-badge.single {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.85);
    }
    .rel-badge.presave {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .rel-title {
      font-family: var(--sans);
      font-size: clamp(2.8rem, 6.5vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.9;
      text-transform: uppercase;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .rel-meta {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .rel-meta span { display: inline-flex; align-items: center; }
    .rel-meta span + span::before {
      content: '·';
      margin-right: 16px;
      color: var(--border-2);
    }

    .rel-story-wrap {
      position: relative;
      margin-bottom: 44px;
      max-width: 480px;
    }
    .rel-story {
      font-size: 16px;
      line-height: 1.75;
      color: var(--fg-dim);
      max-height: calc(1.75em * 4);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-2) transparent;
      overscroll-behavior: contain;
      padding-right: 4px;
    }
    .rel-story::-webkit-scrollbar { width: 4px; }
    .rel-story::-webkit-scrollbar-track { background: transparent; }
    .rel-story::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
    .rel-story p { margin: 0 0 14px; }
    .rel-story p:last-child { margin-bottom: 0; }
    .rel-story a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
    .rel-story a:hover { color: var(--accent); }
    .rel-story-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      background: linear-gradient(to bottom, transparent, var(--bg) 85%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .rel-story-wrap.has-overflow::after { opacity: 1; }

    .rel-cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .rel-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #000;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 18px 34px;
      border: none;
      cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
    }
    .rel-cta:hover { background: var(--accent); color: #fff; }
    .rel-cta:active { transform: scale(0.98); }

    .rel-cta-outline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: #fff;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 17px 32px;
      border: 1px solid var(--border-2);
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.15s var(--ease);
    }
    .rel-cta-outline:hover { border-color: #fff; background: rgba(255,255,255,0.04); }
    .rel-cta-outline:active { transform: scale(0.98); }
    .rel-cta-outline.playing {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }
    .rel-cta-outline .icon-play { width: 12px; height: 12px; fill: currentColor; }
    .rel-cta-outline .icon-eq {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }
    .rel-cta-outline.playing .icon-play { display: none; }
    .rel-cta-outline.playing .icon-eq   { display: flex; }
    .rel-cta-outline .icon-eq span {
      display: block;
      width: 2px;
      background: currentColor;
      border-radius: 1px;
      animation: previewEq 0.9s ease-in-out infinite;
    }
    .rel-cta-outline .icon-eq span:nth-child(1) { height: 6px;  animation-delay: 0s;    }
    .rel-cta-outline .icon-eq span:nth-child(2) { height: 12px; animation-delay: 0.18s; }
    .rel-cta-outline .icon-eq span:nth-child(3) { height: 9px;  animation-delay: 0.36s; }
    @keyframes previewEq {
      0%, 100% { transform: scaleY(0.35); }
      50%      { transform: scaleY(1); }
    }

    .rel-platform-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .rel-platform {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-2);
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s var(--spring);
    }
    .rel-platform:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: scale(1.1);
    }
    .rel-platform svg { width: 18px; height: 18px; fill: currentColor; }

    .rel-section {
      padding: 80px 0;
      border-bottom: 1px solid var(--border);
    }

    .rel-section-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 32px;
      display: block;
    }

    /* ── Tracklist ── */
    .rel-tracklist { display: flex; flex-direction: column; }

    .rel-track {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s var(--ease), padding-left 0.3s var(--ease);
      cursor: pointer;
    }
    .rel-track:last-child { border-bottom: none; }
    .rel-track:hover {
      background: rgba(255, 255, 255, 0.025);
      padding-left: 28px;
    }

    .rel-track-num {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .rel-track-num .track-num-text { transition: opacity 0.2s; }
    .rel-track-num .track-num-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .rel-track-num .track-num-play svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .rel-track-num .track-num-play .icon-eq {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .rel-track-num .track-num-play .icon-eq span {
      display: block;
      width: 2px;
      background: currentColor;
      border-radius: 1px;
      animation: previewEq 0.9s ease-in-out infinite;
    }
    .rel-track-num .track-num-play .icon-eq span:nth-child(1) { height: 5px;  animation-delay: 0s;    }
    .rel-track-num .track-num-play .icon-eq span:nth-child(2) { height: 10px; animation-delay: 0.18s; }
    .rel-track-num .track-num-play .icon-eq span:nth-child(3) { height: 7px;  animation-delay: 0.36s; }

    .rel-track:hover .rel-track-num .track-num-text { opacity: 0; }
    .rel-track:hover .rel-track-num .track-num-play { opacity: 1; }

    .rel-track-num.playing .track-num-text { opacity: 0; }
    .rel-track-num.playing .track-num-play { opacity: 1; color: var(--accent); }
    .rel-track-num.playing .track-num-play .icon-play { display: none; }
    .rel-track-num.playing .track-num-play .icon-eq   { display: flex; }

    .rel-track-name {
      flex: 1;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.005em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rel-track-feat {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .rel-track-dur {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 52px;
      text-align: right;
    }

    /* ── Credits ── */
    .rel-credits {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 40px;
    }
    .rel-credit-group h4 {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .rel-credit-group p {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      line-height: 1.5;
    }

        /* ═══════════════════════════════════════════
       LYRICS — compact reading pane
    ═══════════════════════════════════════════ */
    .lyrics-wrap { max-width: 720px; }

    /* Header row */
    .lyrics-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 20px;
      flex-wrap: wrap;
    }
    .lyrics-header-row .rel-section-label { margin-bottom: 0; }

    .lyrics-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .lyrics-copy:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.04); }
    .lyrics-copy.copied {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .lyrics-copy svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

    /* The card */
    .lyrics-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      max-width: 720px;
    }

    .lyrics-scroll {
      max-height: 440px;
      overflow-y: auto;
      padding: 32px 36px 36px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-2) transparent;
      overscroll-behavior: contain;
    }
    .lyrics-scroll::-webkit-scrollbar { width: 4px; }
    .lyrics-scroll::-webkit-scrollbar-track { background: transparent; }
    .lyrics-scroll::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 2px;
    }
    .lyrics-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Fade masks — controlled by .scrolled-top / .scrolled-bottom */
    .lyrics-card::before,
    .lyrics-card::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 44px;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.25s var(--ease);
    }
    .lyrics-card::before {
      top: 0;
      background: linear-gradient(to bottom, var(--bg-card) 15%, transparent);
    }
    .lyrics-card::after {
      bottom: 0;
      background: linear-gradient(to top, var(--bg-card) 15%, transparent);
    }
    .lyrics-card.scrolled-top::before { opacity: 0; }
    .lyrics-card.scrolled-bottom::after { opacity: 0; }

    /* The block */
    .lyrics-block {
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      color: var(--fg);
      letter-spacing: -0.005em;
    }

    /* Section header — mono blue caps with fading rule */
    .lyrics-section {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.28em;
      color: var(--accent);
      text-transform: uppercase;
      margin: 26px 0 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
    .lyrics-section:first-child { margin-top: 0; }
    .lyrics-section::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-2), transparent);
    }

    /* Lyric line */
    .lyrics-line {
      margin: 0;
      padding: 2px 0 2px 14px;
      color: var(--fg-dim);
      position: relative;
      transition: color 0.2s var(--ease), padding-left 0.2s var(--ease);
      opacity: 0;
      animation: lyricLineIn 0.4s var(--ease) forwards;
    }
    .lyrics-line::before {
      content: '';
      position: absolute;
      left: 2px;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transform: translateY(-50%) scale(0.5);
      transition: opacity 0.2s, transform 0.25s var(--spring);
    }
    .lyrics-block:hover .lyrics-line { color: rgba(255,255,255,0.35); }
    .lyrics-line:hover {
      color: #fff;
      padding-left: 22px;
    }
    .lyrics-line:hover::before {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .lyrics-break { height: 8px; }

    @keyframes lyricLineIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Stagger entrance */
    .lyrics-line:nth-child(1)  { animation-delay: 0.00s; }
    .lyrics-line:nth-child(2)  { animation-delay: 0.015s; }
    .lyrics-line:nth-child(3)  { animation-delay: 0.030s; }
    .lyrics-line:nth-child(4)  { animation-delay: 0.045s; }
    .lyrics-line:nth-child(5)  { animation-delay: 0.060s; }
    .lyrics-line:nth-child(6)  { animation-delay: 0.075s; }
    .lyrics-line:nth-child(7)  { animation-delay: 0.090s; }
    .lyrics-line:nth-child(8)  { animation-delay: 0.105s; }
    .lyrics-line:nth-child(n+9) { animation-delay: 0.12s; }

    /* ── Album accordion — compact cards ── */
    .album-lyrics-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .album-lyrics-track {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      overflow: hidden;
      transition: border-color 0.2s var(--ease);
    }
    .album-lyrics-track:hover,
    .album-lyrics-track[open] { border-color: var(--border-2); }

    .album-lyrics-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .album-lyrics-summary::-webkit-details-marker { display: none; }

    .album-lyrics-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      width: 24px;
      flex-shrink: 0;
    }
    .album-lyrics-name {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.005em;
      text-transform: uppercase;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .album-lyrics-chevron {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform 0.3s var(--spring), color 0.2s;
    }
    .album-lyrics-track[open] .album-lyrics-chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    .album-lyrics-body {
      border-top: 1px solid var(--border);
      padding: 20px 24px 28px;
      max-height: 400px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-2) transparent;
      overscroll-behavior: contain;
    }
    .album-lyrics-body::-webkit-scrollbar { width: 4px; }
    .album-lyrics-body::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 2px;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .lyrics-scroll { max-height: 380px; padding: 24px 20px 28px; }
      .lyrics-block { font-size: 14px; }
      .lyrics-section { margin: 22px 0 10px; }
      .album-lyrics-body { padding: 16px 18px 22px; max-height: 340px; }
    }

    /* ── Related ── */
    .rel-related { padding: 80px 0 40px; }
    .rel-related .grid { margin-top: 32px; }

    .rel-not-found {
      padding: 200px var(--pad-x);
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    @keyframes relFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rel-fade   { animation: relFadeUp 0.7s var(--ease) both; }
    .rel-fade-1 { animation-delay: 0.05s; }
    .rel-fade-2 { animation-delay: 0.15s; }
    .rel-fade-3 { animation-delay: 0.25s; }

    @media (max-width: 900px) {
      .rel-page { padding: 120px var(--pad-x) 0; }
      .rel-hero { grid-template-columns: 1fr; gap: 40px; padding: 30px 0 60px; }
      .rel-cover-wrap { max-width: 420px; }
      .rel-info { max-width: 100%; }
      .rel-title { font-size: clamp(2.2rem, 10vw, 4rem); }
      .rel-section { padding: 56px 0; }
      .rel-platform-row { padding-left: 0; border-left: none; }
      .rel-track { gap: 16px; padding: 16px 12px; }
      .rel-track-feat { display: none; }
      .lyrics-block { font-size: 15px; }
      .lyrics-section { margin-top: 32px; }
    }

    @media (max-width: 480px) {
      .rel-cta { padding: 16px 26px; font-size: 12px; }
      .rel-platform { width: 40px; height: 40px; }
      .rel-platform svg { width: 16px; height: 16px; }
    }
  </style>
</head>

<script>
/* ══════════════════════════════════════════════
   UXBAN — RELEASE DETAIL PAGE
══════════════════════════════════════════════ */

const ICONS = {
  spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
  apple:   '<svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
  play:    '<svg class="icon-play" viewBox="0 0 24 24"><polygon points="5,3 21,12 5,21"/></svg>',
  eq:      '<span class="icon-eq"><span></span><span></span><span></span></span>',
  copy:    '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
  chevron: '<svg class="album-lyrics-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
};

function slugify(name) {
  return String(name || '').toLowerCase()
    .replace(/['']/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

function fmtDuration(ms) {
  if (!ms) return '';
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function stripHtml(html) {
  return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ── Parse raw lyrics string into structured lines ── */
function parseLyrics(raw) {
  const out = [];
  const lines = String(raw || '').trim().split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) {
      out.push({ type: 'break' });
    } else if (/^\[.+\]$/.test(trimmed)) {
      out.push({ type: 'section', label: trimmed.slice(1, -1) });
    } else {
      out.push({ type: 'line', text: trimmed });
    }
  }
  return out;
}

/* ── Render a lyrics block from parsed lines ── */
function lyricsBlockHTML(raw) {
  const parts = parseLyrics(raw);
  if (!parts.length) return '';

  const inner = parts.map(p => {
    if (p.type === 'section') return `<p class="lyrics-section">${escapeHtml(p.label)}</p>`;
    if (p.type === 'break')   return `<div class="lyrics-break"></div>`;
    return `<p class="lyrics-line">${escapeHtml(p.text)}</p>`;
  }).join('');

  return `<div class="lyrics-block">${inner}</div>`;
}

(async function init() {

  const parts = location.pathname.replace(/\/$/, '').split('/');
  const slug  = decodeURIComponent(parts[parts.length - 1] || '');
  if (!slug) return showNotFound();

  let release = null;
  let allReleases = [];
  try {
    const res  = await fetch('/api/spotify');
    const data = await res.json();
    allReleases = [
      ...(data.albums  || []).map(r => ({ ...r, _type: 'ALBUM'  })),
      ...(data.singles || []).map(r => ({ ...r, _type: 'SINGLE' })),
    ];
    release = allReleases.find(r => slugify(r.name) === slug) || null;
  } catch (e) {
    console.warn('Catalog fetch failed:', e.message);
  }

  if (!release) return showNotFound();

  const cfg = window.UXBAN_RELEASE_CONFIG || {};

  /* ── Story: manual > Genius > fallback ── */
  let geniusDesc = null;
  try {
    const gRes = await fetch('/data/genius.json');
    if (gRes.ok) {
      const gData = await gRes.json();
      geniusDesc = (gData.descriptions && gData.descriptions[slug]) || null;
    }
  } catch {}

  const story = (cfg.stories || {})[slug] || geniusDesc || `${release.name} by Uxban.`;

  /* ── Credits ── */
  const baseCredits     = { ...(cfg.defaultCredits || {}) };
  const overrideCredits = (cfg.credits || {})[slug] || {};
  const mergedCredits   = { ...baseCredits, ...overrideCredits };

  const featList = release.featuring || [];
  if (featList.length && !('Featuring' in overrideCredits)) {
    mergedCredits['Featuring'] = featList.join(' & ');
  }
  Object.keys(mergedCredits).forEach(k => { if (!mergedCredits[k]) delete mergedCredits[k]; });
  const credits = mergedCredits;

  /* ── Load lyrics from /lyrics/ folder ──
     Singles:  /lyrics/{slug}.txt
     Albums:   /lyrics/{album-slug}/{track-slug}.txt */
  let singleLyrics = null;
  let albumLyrics  = null;

  if (release.album_type === 'album') {
    // Fetch track list (Vercel caches this response, so it's instant)
    let albumTracks = [];
    if (release.id) {
      try {
        const tRes = await fetch(`/api/spotify?tracks=${release.id}`);
        if (tRes.ok) {
          const tData = await tRes.json();
          albumTracks = tData.tracks || [];
        }
      } catch {}
    }

    if (albumTracks.length) {
      const results = await Promise.all(
        albumTracks.map(async (t) => {
          const trackSlug = slugify(t.name);
          try {
            const res = await fetch(`/lyrics/${slug}/${trackSlug}.txt`);
            if (res.ok) {
              const text = (await res.text()).trim();
              if (text) return { name: t.name, number: t.number, lyrics: text };
            }
          } catch {}
          return null;
        })
      );
      const found = results.filter(Boolean);
      if (found.length) albumLyrics = found;
    }
  } else {
    try {
      const res = await fetch(`/lyrics/${slug}.txt`);
      if (res.ok) {
        const text = (await res.text()).trim();
        if (text) singleLyrics = text;
      }
    } catch {}
  }

  /* ── Fields ── */
  const cover   = release.images?.[0]?.url || '';
  const year    = release.release_date?.slice(0, 4) || '';
  const type    = release.album_type === 'album' ? 'ALBUM' : 'SINGLE';
  const typeLc  = type.toLowerCase();
  const isAlbum = type === 'ALBUM';
  const isReleased = release.release_date
    ? new Date(release.release_date) <= new Date()
    : true;
  const links = release.links || {};

  /* ── Meta ── */
  const pageUrl    = `${location.origin}/release/${slug}/`;
  const plainStory = stripHtml(story).slice(0, 160);
  document.title = `Uxban — ${release.name}`;
  document.getElementById('page-title').textContent = `Uxban — ${release.name}`;
  document.getElementById('meta-desc').content      = plainStory;
  document.getElementById('og-url').content         = pageUrl;
  document.getElementById('og-title').content       = `Uxban — ${release.name}`;
  document.getElementById('og-desc').content        = plainStory;
  document.getElementById('tw-title').content       = `Uxban — ${release.name}`;
  document.getElementById('tw-desc').content        = plainStory;
  if (cover) {
    document.getElementById('og-image').content = cover;
    document.getElementById('tw-image').content = cover;
  }

  /* ── Tracklist ── */
  let tracks = [];
  if (isAlbum && release.id) {
    try {
      const tRes = await fetch(`/api/spotify?tracks=${release.id}`);
      if (tRes.ok) {
        const tData = await tRes.json();
        tracks = tData.tracks || [];
      }
    } catch {}
  }

  /* ── CTA + platforms ── */
  const ctaText = isReleased ? 'LISTEN NOW' : 'PRE-SAVE NOW';
  const ctaUrl  = `/listen/${slug}/`;

  const platformBtns = [];
  if (links.spotify)      platformBtns.push(`<a class="rel-platform" href="${links.spotify}"      target="_blank" rel="noopener" aria-label="Spotify">${ICONS.spotify}</a>`);
  if (links.appleMusic)   platformBtns.push(`<a class="rel-platform" href="${links.appleMusic}"   target="_blank" rel="noopener" aria-label="Apple Music">${ICONS.apple}</a>`);
  if (links.youtubeMusic) platformBtns.push(`<a class="rel-platform" href="${links.youtubeMusic}" target="_blank" rel="noopener" aria-label="YouTube Music">${ICONS.youtube}</a>`);

  /* ── Related ── */
  const related = allReleases
    .filter(r => r.id !== release.id)
    .sort((a, b) => new Date(b.release_date) - new Date(a.release_date))
    .slice(0, 4);

  const relatedHTML = related.length ? `
    <div class="rel-related">
      <p class="rel-section-label">// MORE FROM UXBAN</p>
      <div class="grid">
        ${related.map(r => {
          const rSlug  = slugify(r.name);
          const rCover = r.images?.[0]?.url || '';
          const rYear  = r.release_date?.slice(0, 4) || '';
          return `
            <a class="grid-card spotlight-card" href="/release/${rSlug}/">
              <div class="grid-img">
                <img src="${rCover}" alt="${r.name}" loading="lazy">
              </div>
              <div class="grid-info">
                <h3 class="grid-name">${r.name}</h3>
                <p class="grid-price">${r._type} · ${rYear}</p>
              </div>
            </a>`;
        }).join('')}
      </div>
    </div>` : '';

  /* ── Lyrics HTML ── */
  let lyricsHTML = '';

  if (singleLyrics) {
    lyricsHTML = `
      <div class="rel-section">
        <div class="lyrics-header-row">
          <span class="rel-section-label">// LYRICS</span>
          <button class="lyrics-copy" id="lyrics-copy-btn">
            ${ICONS.copy} COPY
          </button>
        </div>
        <div class="lyrics-card" id="lyrics-card">
          <div class="lyrics-scroll" id="lyrics-scroll">
            ${lyricsBlockHTML(singleLyrics)}
          </div>
        </div>
      </div>`;
  } else if (albumLyrics && albumLyrics.length) {
    lyricsHTML = `
      <div class="rel-section">
        <span class="rel-section-label">// LYRICS</span>
        <div class="album-lyrics-list">
          ${albumLyrics.map(({ name, number, lyrics }) => `
            <details class="album-lyrics-track">
              <summary class="album-lyrics-summary">
                <span class="album-lyrics-num">${String(number).padStart(2, '0')}</span>
                <span class="album-lyrics-name">${escapeHtml(name)}</span>
                ${ICONS.chevron}
              </summary>
              <div class="album-lyrics-body">
                ${lyricsBlockHTML(lyrics)}
              </div>
            </details>
          `).join('')}
        </div>
      </div>`;
  }

  /* ── Render ── */
  const root = document.getElementById('rel-page');

  root.innerHTML = `
    <div class="rel-hero">
      <div class="rel-cover-wrap rel-fade rel-fade-1">
        ${cover ? `
          <div class="rel-cover-glow" style="background-image:url('${cover}')"></div>
          <div class="rel-cover" id="rel-cover" style="background-image:url('${cover}')"></div>
        ` : ''}
      </div>
      <div class="rel-info">
        <span class="rel-badge ${isReleased ? typeLc : 'presave'} rel-fade rel-fade-1">
          ${isReleased ? type : 'PRE-SAVE'}
        </span>
        <h1 class="rel-title rel-fade rel-fade-2">${release.name}</h1>
        <div class="rel-meta rel-fade rel-fade-2">
          <span>${year}</span>
          ${tracks.length ? `<span>${tracks.length} TRACK${tracks.length !== 1 ? 'S' : ''}</span>` : ''}
          ${!isReleased && release.release_date ? `<span>DROPS ${new Date(release.release_date).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' }).toUpperCase()}</span>` : ''}
        </div>
        <div class="rel-story-wrap rel-fade rel-fade-3">
          <div class="rel-story" id="rel-story">${story}</div>
        </div>
        <div class="rel-cta-row rel-fade rel-fade-3">
          <a class="rel-cta" href="${ctaUrl}">
            ${ctaText}
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <button class="rel-cta-outline" id="rel-preview-btn" data-preview="1" data-name="${release.name}" data-id="${release.id}">
            ${ICONS.play}${ICONS.eq} PREVIEW
          </button>
          ${platformBtns.length ? `
            <div class="rel-platform-row">
              ${platformBtns.join('')}
            </div>` : ''}
        </div>
      </div>
    </div>

    ${tracks.length ? `
      <div class="rel-section">
        <span class="rel-section-label">// TRACKLIST</span>
        <div class="rel-tracklist">
          ${tracks.map(t => `
            <div class="rel-track" data-track-url="${ctaUrl}">
              <span class="rel-track-num">
                <span class="track-num-text">${String(t.number).padStart(2, '0')}</span>
                <button class="track-num-play" data-preview="1" data-name="${t.name}" data-id="${release.id}" data-track-index="${t.number}" aria-label="Play ${t.name} preview">
                  ${ICONS.play}${ICONS.eq}
                </button>
              </span>
              <span class="rel-track-name">${t.name}</span>
              ${t.featuring && t.featuring.length
                ? `<span class="rel-track-feat">FEAT. ${t.featuring.join(', ').toUpperCase()}</span>`
                : ''}
              <span class="rel-track-dur">${fmtDuration(t.duration)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    ${Object.keys(credits).length ? `
      <div class="rel-section">
        <span class="rel-section-label">// CREDITS</span>
        <div class="rel-credits">
          ${Object.entries(credits).map(([role, who]) => `
            <div class="rel-credit-group">
              <h4>${role}</h4>
              <p>${who}</p>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}

    ${lyricsHTML}

    ${relatedHTML}
  `;

  /* ── Wire lyrics copy buttons ── */
  const copyBtn = document.getElementById('lyrics-copy-btn');
  if (copyBtn && singleLyrics) {
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(singleLyrics.trim()).then(() => {
        const orig = copyBtn.innerHTML;
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = `${ICONS.copy} COPIED`;
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = orig;
        }, 1800);
      });
    });
  }

    /* ── Lyrics card scroll fades ── */
  const lyricsCard   = document.getElementById('lyrics-card');
  const lyricsScroll = document.getElementById('lyrics-scroll');
  if (lyricsCard && lyricsScroll) {
    const update = () => {
      const atTop    = lyricsScroll.scrollTop <= 4;
      const atBottom = lyricsScroll.scrollTop + lyricsScroll.clientHeight >= lyricsScroll.scrollHeight - 4;
      lyricsCard.classList.toggle('scrolled-top', atTop);
      lyricsCard.classList.toggle('scrolled-bottom', atBottom);
    };
    update();
    lyricsScroll.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
  }

  /* ── Story overflow ── */
  const storyEl   = document.getElementById('rel-story');
  const storyWrap = document.querySelector('.rel-story-wrap');
  if (storyEl && storyWrap) {
    const check = () => {
      const hasOverflow = storyEl.scrollHeight > storyEl.clientHeight + 2;
      const atBottom    = storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 4;
      storyWrap.classList.toggle('has-overflow', hasOverflow && !atBottom);
    };
    check();
    storyEl.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check, { passive: true });
  }

  /* ── Wire preview buttons ── */
  root.querySelectorAll('[data-preview]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      if (window.UxbanPreview) {
        window.UxbanPreview.toggle(btn, btn.dataset.name, 'Uxban');
      }
    });
  });

  /* ── Track row click → listen ── */
  root.querySelectorAll('.rel-track').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('[data-preview]')) return;
      window.location.href = row.dataset.trackUrl;
    });
  });

  /* ── Track num playing state ── */
  root.querySelectorAll('.track-num-play').forEach(btn => {
    const obs = new MutationObserver(() => {
      btn.closest('.rel-track-num')?.classList.toggle('playing', btn.classList.contains('playing'));
    });
    obs.observe(btn, { attributes: true, attributeFilter: ['class'] });
  });

  /* ── Scroll-driven cover ── */
  const coverEl = document.getElementById('rel-cover');
  if (coverEl) {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y     = window.scrollY;
        const rot   = Math.max(-3, Math.min(3, y * 0.004));
        const scale = Math.min(1.04, 1 + y * 0.00006);
        coverEl.style.transform = `rotate(${rot}deg) scale(${scale})`;
        ticking = false;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
  }

})();

function showNotFound() {
  const root = document.getElementById('rel-page');
  if (root) {
    root.innerHTML = `
      <div class="rel-not-found">
        <p style="margin-bottom:16px">// RELEASE NOT FOUND</p>
        <a href="/releases/" style="color:var(--accent);text-decoration:none;">← BACK TO RELEASES</a>
      </div>`;
  }
}

/* ── Nav / banner / scroll-top ── */
const scrollTop = document.getElementById('scroll-top');
if (scrollTop) {
  window.addEventListener('scroll', () => scrollTop.classList.toggle('visible', window.scrollY > 400), { passive: true });
  scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

const hamburger = document.getElementById('hamburger');
const mobileNav = document.getElementById('mobile-nav');
if (hamburger && mobileNav) {
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileNav.classList.toggle('open');
  });
}

const topBar = document.getElementById('top-bar');
if (topBar) {
  window.addEventListener('scroll', () => topBar.classList.toggle('scrolled', window.scrollY > 60), { passive: true });
}

function updateNavOffset() {
  const banner = document.getElementById('site-banner');
  const nav    = document.getElementById('top-bar');
  if (!nav) return;
  const visible = banner && banner.style.display !== 'none' && !banner.classList.contains('dismissed');
  nav.style.top = visible ? banner.offsetHeight + 'px' : '0';
}
updateNavOffset();
window.addEventListener('resize', updateNavOffset);
document.addEventListener('uxban:banner-rendered', () => setTimeout(updateNavOffset, 10));
</script>

<script src="/assets/command-palette.js" defer></script>
