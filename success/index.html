<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/banner.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uxban | Order Confirmed</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    .success-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 120px var(--pad-x) 80px; gap: 20px;
    }
    .success-tag {
      font-size: 8.5px; letter-spacing: 5px; color: var(--neon);
      font-family: var(--mono); text-transform: uppercase;
    }
    .success-title {
      font-size: clamp(3rem, 10vw, 7rem); font-weight: 900;
      letter-spacing: -0.055em; line-height: 0.88;
    }
    .success-msg {
      font-size: 12px; color: rgba(255,255,255,0.4);
      font-family: var(--mono); letter-spacing: 1.5px; line-height: 1.8;
      max-width: 420px; margin-top: 10px;
    }
    .success-tag-us {
      margin-top: 10px; font-size: 9px; letter-spacing: 3px;
      color: var(--accent); font-family: var(--mono);
    }
    .success-tag-us a {
      color: var(--neon); text-decoration: none;
      border-bottom: 1px solid rgba(0,255,106,0.3); padding-bottom: 2px;
    }
    .success-back {
      margin-top: 30px; display: inline-block;
      font-size: 8.5px; letter-spacing: 3px; font-weight: 700;
      font-family: var(--mono); color: rgba(255,255,255,0.4);
      text-decoration: none; border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 28px; border-radius: 24px;
      transition: border-color 0.25s, color 0.25s, background 0.25s, transform 0.2s var(--spring);
    }
    .success-back:hover {
      border-color: rgba(0,255,106,0.3); color: var(--neon);
      background: var(--neon-dim); transform: scale(1.04);
    }
  </style>
</head>
<body>
<div class="noise"></div>

<nav class="top-bar" id="top-bar">
  <div class="logo-wrap"><a href="/"><img src="/assets/images/logo.png" class="nav-logo" alt="uxban"></a></div>
  <div class="nav-links">
    <a href="/">HOME</a>
    <a href="/releases/">RELEASES</a>
    <a href="/store/" class="active">STORE</a>
  </div>
  <div class="nav-info">
    <span class="dot"></span>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="page-wrap">
  <div class="success-wrap">
    <p class="success-tag">// order confirmed</p>
    <h1 class="success-title">You're locked in.</h1>
    <p class="success-msg">
      Order received. We'll get it sorted and on its way to you.
      Check your email for confirmation.
    </p>
    <p class="success-tag-us">
      rock it and tag <a href="https://instagram.com/uxbanwtf" target="_blank">@uxbanwtf</a> — we repost everyone.
    </p>
    <a href="/store/" class="success-back">← Back to Store</a>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
